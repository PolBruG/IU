<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8">
    <title>Perfil d'usuari</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  
  <body>
    <header>
      <a href="main.html"> <img src="domotica.png" alt="logo" height="40" width="40"> </a>
      
      <form>
        <input type="text" name="buscar" placeholder="Buscar...">
        <button type="submit">Buscar</button>
      </form>  
      
    </header>

    <main class="perfil-container">
      <h1>El meu perfil</h1>

      <section class="perfil-card">
        

        <div class="w3-card-4 test" style="width:92%;max-width:200px;">
          <img src="foto_perfil.png" alt="Avatar" style="width:100%;opacity:0.85">
          <div class="w3-container">
          <h2><b>Alex</b></h2>    
          </div>
        </div>
        <br>
        <div class="perfil-datos">
          <h2>Correu electrònic</h2>
          <p>exemple@gmail.com</p>
        </div>
        </div>

        <hr style="border: 0; border-top: 1px solid #ddd; margin: 25px 0;">

        <div class="perfil-config">
          <h3>⚙️ Configuració del compte</h3>
          <ul class="lista-config">
            <li><a href="#">🔒Canvia contrasenya</a></li>
            <li><a href="#">🔔Notificacions</a></li>
            <li><a href="#">🌍Idioma: Català</a></li>
            <li><a href="#">👤Gestionar compte</a></li>
            <li><a href="#">Tancar Sessió</a></li>
          </ul>
        </div>

      </section>
    </main>

  </body>
</html>
